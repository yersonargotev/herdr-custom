name: Build and verify
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: '1.96.1'
      - uses: vercel-labs/setup-zig@83c1594f26b86da8a9a8ddd9b5ee5f3af0f96943
        with:
          version: '0.16.0'
      - name: Verify recipe and release version
        run: |
          python3 -m unittest discover -s tests -v
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
          fi
      - name: Install build dependencies
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install cmake ninja
      - name: Build, test, and package
        run: python3 scripts/build.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: herdr-custom-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: dist
          merge-multiple: true
      - name: Publish verified binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum --check *.sha256
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Herdr Custom ${GITHUB_REF_NAME#v}" \
            --notes 'Independent compact UI distribution. See README for installation, upstream version, configuration, compatibility, and rollback.' \
            --draft *.tar.gz *.sha256
